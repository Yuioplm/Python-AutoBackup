<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
        }
        th {
            background-color: #f0f0f0;
        }
    </style>

</head>
<body>
    <h1>AutoBackup</h1>
    
    {% if records %}
    <table>
        <thead>
            <tr>
                <th>Filename</th>
                <th>OriginalPath</th>
                <th>LastWriteTime</th>
                <th>CopiedAt</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for r in records %}
            <tr>
                <td>{{ r.FileName }}</td>
                <td>{{ r.OriginalPath }}</td>
                <td>{{ r.LastWriteTime }}</td>
                <td>{{ r.CopiedAt }}</td>
                <td>{{ r.Status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
<p>No Backup records found.</p>
{% endif %}

</body>
</html>
